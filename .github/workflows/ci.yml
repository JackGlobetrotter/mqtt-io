name: MQTT IO CI
on:
  - push
  - pull_request
  - release
  - workflow_dispatch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:

  build_docker_image:
    name: Build Docker Image
    if: (github.event_name == 'release' && github.event.action == 'created') || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - uses: docker/setup-qemu-action@v1
      - id: buildx
        uses: docker/setup-buildx-action@v1
      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'release' && github.event.action == 'created'
        run: |
          # Remove prefix release
          TAG_NAME=${GITHUB_REF##*/}
          # Change slashes to hyphens
          TAG_NAME=${TAG_NAME//\//-}
          docker buildx build --platform linux/arm/v7,linux/arm64/v8,linux/amd64 -t flyte/mqtt-io:${TAG_NAME} -t flyte/mqtt-io:latest --push .
      - if: github.event_name == 'push'
        run: |
          # Remove prefix push
          TAG_NAME=${GITHUB_REF##*/}
          # Change slashes to hyphens
          TAG_NAME=${TAG_NAME//\//-}
          docker buildx build --platform linux/arm/v7,linux/arm64/v8,linux/amd64 -t flyte/mqtt-io:${TAG_NAME} .
